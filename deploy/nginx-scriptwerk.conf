# Scriptwerk hinter Nginx mit DNS-Name + TLS.
# Backend bleibt http://127.0.0.1:8081 (Docker). Nginx nur 80/443.
#
#   sudo cp deploy/nginx-scriptwerk.conf /etc/nginx/sites-available/scriptwerk
#   server_name + Zertifikatpfade anpassen
#   sudo ln -sf /etc/nginx/sites-available/scriptwerk /etc/nginx/sites-enabled/scriptwerk
#   sudo nginx -t && sudo systemctl reload nginx
#
# 403: kein root/alias, kein Unterpfad, server_name = Name in der Adresszeile.
# Nginx Proxy Manager: Scheme http, Port 8081, Websockets an,
# „Block common exploits“ / Access List aus — die 403en oft.
# Log: sudo tail -n 40 /var/log/nginx/error.log

server {
    listen 80;
    listen [::]:80;
    server_name scriptwerk.example.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scriptwerk.example.de;

    ssl_certificate     /etc/letsencrypt/live/scriptwerk.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scriptwerk.example.de/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
