# Nur den location-Block in einen bestehenden server { } kopieren.
# Nicht als eigene Datei in sites-enabled legen (kein server-Block).
#
# Wenn unter / schon eine andere Website liegt: nicht ersetzen.
# Dann eigenen vhost (nginx-scriptwerk.conf) mit eigenem server_name,
# nicht Unterpfad /scriptwerk — die App erwartet /.
#
# Port = SCRIPTWERK_PORT (oft 8081).

location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffering off;
}
